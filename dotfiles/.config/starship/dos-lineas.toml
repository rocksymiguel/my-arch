# Dos líneas: información arriba, flecha abajo
add_newline = true
format = """$directory$git_branch$git_status$cmd_duration$time
$character"""

[directory]
style = "bold cyan"
truncation_length = 4
format = "[󰉋 $path]($style) "

[git_branch]
symbol = " "
style = "blue"
format = "[$symbol$branch]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "bright-black"
format = "[󰥔 $time]($style)"

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[❯](bold red)"

[git_status]
format = '[$all_status$ahead_behind]($style) '
style = "yellow"

[cmd_duration]
min_time = 2000
format = "[󰥔 $duration]($style) "
style = "bright-black"
