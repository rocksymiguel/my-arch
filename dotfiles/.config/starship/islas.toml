# Islas: bloques redondeados, como la barra
add_newline = true
format = """[](cyan)$directory[](cyan) $git_branch$git_status$cmd_duration
$character"""

[directory]
style = "bg:cyan fg:black bold"
truncation_length = 3
format = "[󰉋 $path]($style)"

[git_branch]
symbol = " "
style = "bg:blue fg:black"
format = "[](blue)[$symbol$branch]($style)[](blue) "

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[❯](bold red)"

[git_status]
format = '[$all_status$ahead_behind]($style) '
style = "yellow"

[cmd_duration]
min_time = 2000
format = "[󰥔 $duration]($style) "
style = "bright-black"
