# Mínimo: solo la flecha; la carpeta solo fuera de ~
add_newline = false
format = "$directory$git_branch$character"

[directory]
style = "bright-black"
truncation_length = 2
home_symbol = ""
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "bright-black"
format = "[$symbol$branch]($style) "

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[❯](bold red)"
