# Pantalla de bloqueo, estilo "completo": hora, fecha y tiempo, música, batería y contraseña.
# Fondo: el fondo de pantalla actual desenfocado (lo prepara `bloquear` en ~/.cache/theme).
# Atajos: Esc, Ctrl+U o Ctrl+Retroceso borran la contraseña escrita.
# Plantilla: `tema` genera ~/.config/hypr/hyprlock.conf con el tamaño elegido ({{e:N}} = N px a 100 %).

$font = JetBrainsMono Nerd Font

# Colores del tema activo ($c_accent, $c_text…); los genera `tema`
source = ~/.config/hypr/colors-hyprlock.conf

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.cache/theme/fondo-bloqueo
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
}

# HORA (arriba a la izquierda)
label {
    monitor =
    text = $TIME
    font_size = {{e:80}}
    font_family = $font
    shadow_passes = 2
    shadow_size = {{e:4}}
    shadow_color = rgba(0, 0, 0, 0.6)
    color = rgb(eceff4)
    position = {{e:50}}, {{e:-40}}
    halign = left
    valign = top
}

# FECHA Y TIEMPO
label {
    monitor =
    text = cmd[update:600000] echo "$(LC_TIME=es_EC.UTF-8 date +'%A %d de %B') · $(~/.config/waybar/scripts/clima texto)"
    font_size = {{e:16}}
    font_family = $font
    shadow_passes = 2
    shadow_size = {{e:4}}
    shadow_color = rgba(0, 0, 0, 0.6)
    color = rgb(d8dee9)
    position = {{e:54}}, {{e:-165}}
    halign = left
    valign = top
}

# BATERÍA (arriba a la derecha; sin batería, vacío)
label {
    monitor =
    text = cmd[update:30000] cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n 1 | sed 's/^/󰁹 /; s/$/%/'
    font_size = {{e:14}}
    font_family = $font
    shadow_passes = 2
    shadow_size = {{e:4}}
    shadow_color = rgba(0, 0, 0, 0.6)
    color = rgb(eceff4)
    position = {{e:-40}}, {{e:-30}}
    halign = right
    valign = top
}

# MÚSICA (lo que suena, si hay algo)
label {
    monitor =
    text = cmd[update:3000] ~/.config/theme/bloqueo-info musica
    font_size = {{e:14}}
    font_family = $font
    shadow_passes = 2
    shadow_size = {{e:4}}
    shadow_color = rgba(0, 0, 0, 0.6)
    color = $c_accent
    position = {{e:54}}, {{e:130}}
    halign = left
    valign = bottom
}

# AVISO DE BLOQ MAYÚS (encima de la contraseña)
label {
    monitor =
    text = cmd[update:500] ~/.config/theme/bloqueo-info mayus
    font_size = {{e:12}}
    font_family = $font
    color = $c_warn
    position = {{e:54}}, {{e:96}}
    halign = left
    valign = bottom
}

# CONTRASEÑA (abajo a la izquierda)
input-field {
    monitor =
    size = {{e:320}}, {{e:46}}
    outline_thickness = {{e:2}}
    inner_color = rgba(0, 0, 0, 0.25)
    outer_color = $c_accent $c_accent2 45deg
    check_color = $c_ok $c_accent 120deg
    fail_color = $c_err $c_warn 40deg
    capslock_color = $c_warn   # borde naranja = Bloq Mayús activado
    font_color = rgb(eceff4)
    fade_on_empty = false
    rounding = {{e:14}}
    font_family = $font
    placeholder_text = Contraseña…
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = {{e:50}}, {{e:40}}
    halign = left
    valign = bottom
}
