# Prompt de una línea: carpeta, rama de git, duración (si tardó más de 2 s) y la flecha
add_newline = true   # una línea en blanco entre un comando y el siguiente
format = "$directory$git_branch$git_status$cmd_duration$character"

[directory]
style = "bold cyan"
truncation_length = 3
format = "[󰉋 $path]($style) "

[git_branch]
symbol = " "
style = "blue"
format = "[$symbol$branch]($style) "

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[❯](bold red)"

[git_status]
format = '[$all_status$ahead_behind]($style) '
style = "yellow"

[cmd_duration]
min_time = 2000
format = "[󰥔 $duration]($style) "
style = "bright-black"
