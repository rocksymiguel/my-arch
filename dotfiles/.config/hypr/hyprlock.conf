# Pantalla de bloqueo, estilo "completo": hora, fecha y tiempo, música, batería y contraseña.
# Fondo: el fondo de pantalla actual desenfocado (lo prepara `bloquear` en ~/.cache/theme).
# Atajos: Esc, Ctrl+U o Ctrl+Retroceso borran la contraseña escrita.

$font = JetBrainsMono Nerd Font

# Colores del tema activo ($c_accent, $c_text…); los genera `tema`
source = ~/.config/hypr/colors-hyprlock.conf

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.cache/theme/fondo-bloqueo
    blur_passes = 3
    blur_size = 7
    brightness = 0.7
}

# HORA (arriba a la izquierda)
label {
    monitor =
    text = $TIME
    font_size = 80
    font_family = $font
    color = $c_text
    position = 50, -40
    halign = left
    valign = top
}

# FECHA Y TIEMPO
label {
    monitor =
    text = cmd[update:600000] echo "$(LC_TIME=es_EC.UTF-8 date +'%A %d de %B') · $(~/.config/waybar/scripts/clima texto)"
    font_size = 16
    font_family = $font
    color = $c_muted
    position = 54, -165
    halign = left
    valign = top
}

# BATERÍA (arriba a la derecha)
label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT0/capacity)%"
    font_size = 14
    font_family = $font
    color = $c_text
    position = -40, -30
    halign = right
    valign = top
}

# MÚSICA (lo que suena, si hay algo)
label {
    monitor =
    text = cmd[update:3000] playerctl metadata --format '󰝚  {{artist}} · {{title}}' 2>/dev/null
    font_size = 14
    font_family = $font
    color = $c_accent
    position = 54, 110
    halign = left
    valign = bottom
}

# CONTRASEÑA (abajo a la izquierda)
input-field {
    monitor =
    size = 320, 46
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.25)
    outer_color = $c_accent $c_accent2 45deg
    check_color = $c_ok $c_accent 120deg
    fail_color = $c_err $c_warn 40deg
    font_color = $c_text
    fade_on_empty = false
    rounding = 14
    font_family = $font
    placeholder_text = Contraseña…
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 50, 40
    halign = left
    valign = bottom
}
