# Limine: menú de arranque con tema Nord. Se edita en ~/my-arch/install/limine.conf
# y se instala con: sudo bash ~/my-arch/install/limine.sh
timeout: 5
default_entry: 1
remember_last_entry: yes
interface_branding: Arch Linux
interface_branding_colour: 88c0d0
interface_help_hidden: yes
editor_enabled: no

# Un fondo al azar en cada arranque: limine.sh cambia __FONDOS__ por una línea `wallpaper:` por fondo
__FONDOS__
wallpaper_style: stretched
backdrop: 1f232b

term_palette: 3b4252;bf616a;a3be8c;ebcb8b;81a1c1;b48ead;88c0d0;e5e9f0
term_palette_bright: 4c566a;bf616a;a3be8c;ebcb8b;5e81ac;b48ead;8fbcbb;eceff4
term_background: 401f232b
term_foreground: eceff4
term_background_bright: 2b303b
term_margin: 40

/Arch Linux · Escritorio
    protocol: linux
    path: boot():/vmlinuz-linux
    cmdline: root=UUID=__ROOTUUID__ rw quiet splash modo=escritorio
    module_path: boot():/amd-ucode.img
    module_path: boot():/initramfs-linux.img

/Arch Linux · Juego
    protocol: linux
    path: boot():/vmlinuz-linux
    cmdline: root=UUID=__ROOTUUID__ rw quiet splash modo=juego
    module_path: boot():/amd-ucode.img
    module_path: boot():/initramfs-linux.img
