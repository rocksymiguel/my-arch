# TLP para la Lenovo IdeaPad 3 15ADA05 (Ryzen 5 3500U, acpi-cpufreq).
# Se instala en /etc/tlp.d/10-lenovo.conf con install/energia.sh. El resto usa los valores de TLP.

# Turbo de la CPU: apagado con batería (menos consumo), encendido enchufado
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# Sin límite de carga: la batería ya está al ~68 % de su capacidad de diseño y el 80 % la dejaría en ~2,5 h.
# Para limitarla (IdeaPad: 1 = conservation_mode, carga hasta ~80 %), quitar la almohadilla:
#STOP_CHARGE_THRESH_BAT0=1
